# golangci-lint para el backend Go. Esquema v2.
#
# La versión de la herramienta está fijada en el Makefile y en CI (v2.14.0):
# otro esquema u otra versión cambia el resultado del mismo código.
version: "2"

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # §7.4: las dependencias externas se aprueban explícitamente.
    - depguard
    # §7.4: los errores se envuelven con %w, no se comparan ni se aplanan.
    - errorlint
    # Un //nolint tiene que decir por qué y sobre qué linter; si sobra, molesta.
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        # En Fase 0 sólo existe internal/platform, así que la lista aprueba el
        # stdlib, nuestro módulo y las librerías ya elegidas. Las reglas de
        # capas de §3 (domain / app / adapters) se suman con los módulos, en
        # Fase 1. Agregar una dependencia externa es agregar su import acá.
        backend:
          files:
            - $all
          allow:
            - $gostd
            - github.com/joaquinBrassinne/MOVO
            - github.com/go-chi/chi/v5
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - github.com/testcontainers/testcontainers-go
            - golang.org/x/crypto/argon2
            - github.com/golang-jwt/jwt/v5
            - github.com/aws/aws-sdk-go-v2
            - github.com/aws/smithy-go
        # §3.3 regla 1: el dominio de cada módulo no importa infraestructura,
        # aunque la regla "backend" autorice esos paquetes para otras capas.
        domain-is-pure:
          files:
            - "**/internal/*/domain/**"
            - "!$test"
          list-mode: lax
          deny:
            - pkg: github.com/jackc/pgx
              desc: domain must not depend on the database driver
            - pkg: github.com/go-chi/chi
              desc: domain must not depend on the HTTP router
            - pkg: github.com/aws
              desc: domain must not depend on the object storage SDK
            - pkg: github.com/joaquinBrassinne/MOVO/internal/platform
              desc: domain must not depend on platform infrastructure
        # §3.3 regla 2: app depende de interfaces (ports.go), nunca de adapters.
        app-uses-ports:
          files:
            - "**/internal/*/app/**"
            - "!$test"
          list-mode: lax
          deny:
            - pkg: github.com/joaquinBrassinne/MOVO/internal/identity/adapters
              desc: app must depend on the ports, not on adapters
            - pkg: github.com/joaquinBrassinne/MOVO/internal/business/adapters
              desc: app must depend on the ports, not on adapters
            - pkg: github.com/joaquinBrassinne/MOVO/internal/billing/adapters
              desc: app must depend on the ports, not on adapters
            - pkg: github.com/joaquinBrassinne/MOVO/internal/benefits/adapters
              desc: app must depend on the ports, not on adapters
            - pkg: github.com/aws
              desc: app must not depend on the object storage SDK
            - pkg: github.com/jackc/pgx
              desc: app must not depend on the database driver
            - pkg: github.com/go-chi/chi
              desc: app must not depend on the HTTP router
