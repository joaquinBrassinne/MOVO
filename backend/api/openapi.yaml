      description: >-
        Creates an active branch. The plan limits how many branches may be active at once (via entitlements,
        pilot businesses get the Pro limits); retired branches do not count. The check is atomic under concurrent
        requests. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
