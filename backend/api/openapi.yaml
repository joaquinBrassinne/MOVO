        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has no business (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 'The plan has no room for another branch (plan_limit_reached, details.resource = branches) or the business was deleted (business_deleted).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: >-
            Validation failed. details.field is one of name, address, city, location (invalid), booking_url
            (invalid), reference (too_long).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/branches/{id}:
