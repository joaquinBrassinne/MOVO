          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    delete:
      operationId: businessRetireBranch
      summary: Retire a branch
      description: >-
        Takes the branch off the map by setting active to false; it is never deleted because metrics, coupons and
        reviews reference it. Idempotent. Show it again with PUT /me/business/branches/{id}/active. Requires role
