  /admin/businesses:
    get:
      operationId: businessAdminList
      summary: List businesses
      description: >-
        Super admin list of businesses, filterable and paged, with per-status counts. Requires role
        super_admin. Responses are Cache-Control no-store.
      tags: [Business admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only businesses in this status.
          schema:
            $ref: '#/components/schemas/BusinessStatus'
        - name: q
          in: query
          required: false
          description: Free-text search.
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          required: false
          description: Only businesses of this category.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of businesses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAdminList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'An invalid or non-numeric filter or paging value. details.field is filter (invalid).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/businesses/{id}:
    get:
      operationId: businessAdminGet
      summary: Get a business
      description: >-
        Super admin detail of a business: owner, branches, service counts and the audit history of what admins did
        to it. Requires role super_admin.
      tags: [Business admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Business id (non-numeric ids are answered as not found).
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The business detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAdminDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'No such business, or a non-numeric id (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /admin/businesses/{id}/actions:
    post:
      operationId: businessAdminApplyAction
      summary: Apply an admin action to a business
      description: >-
        Applies one super admin decision (approve, pause, reactivate, delete, verify, revoke_verification,
        mark_pilot, unmark_pilot) and records it in the audit log in the same transaction. Status changes follow
        draft/pending_review/active/paused/deleted rules: approve needs pending_review, pause needs active,
        reactivate needs paused, delete is allowed from any status but deleted. A deleted business cannot change.
        Requires role super_admin.
      tags: [Business admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Business id (non-numeric ids are answered as not found).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessAdminActionRequest'
      responses:
        '200':
          description: The business after the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'No such business, or a non-numeric id (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: >-
            invalid_state (the status does not allow the action), business_deleted (the business was deleted),
            no_change (verify, revoke_verification, mark_pilot or unmark_pilot when already in that state) or
            conflict (someone changed the business first; reload and retry).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Unknown action. details.field is action (unknown).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
