openapi: 3.0.3
info:
  title: MOVO API
  version: 1.0.0
  description: |
    HTTP API of the MOVO platform: businesses that offer physical and wellness activities,
    the map that lists them, and the coupons customers redeem at the business.

    **Conventions**
    - Every endpoint lives under `/api/v1`, except the `/healthz` and `/readyz` probes.
    - Bodies are JSON. Every failure uses the same envelope, `{"error": {"code", "message", "details"}}`;
      `code` is stable and meant for programs, `message` is for people.
    - Owners and the super admin authenticate with a JWT access token
      (`Authorization: Bearer <token>`). Customers have no account.
    - Every response carries `X-Request-Id`; send your own to correlate a request in the logs.
    - Metrics are aggregated counters, never personal data.
servers:
  - url: /api/v1
    description: Same origin as this page
security: []
paths:
  /healthz:
    servers:
      - url: /
    get:
      operationId: operationsHealthz
      summary: Liveness probe
      description: Answers 200 while the process serves HTTP. It checks no dependency. Served at the server root, not under /api/v1.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProbeStatus'
              example:
                status: ok
  /readyz:
    servers:
      - url: /
    get:
      operationId: operationsReadyz
      summary: Readiness probe
      description: Pings the database with a bounded timeout. Served at the server root, not under /api/v1. Internal details are never exposed.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProbeStatus'
              example:
                status: ready
        '503':
          description: The database is not reachable (code `not_ready`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_ready
                  message: database is not reachable
  /auth/register:
    post:
      operationId: identityRegister
      summary: Register a business owner account
      description: |
        Creates a `business_admin` user and returns a session. Rate limited per client IP
        (10 attempts per hour). The response is sent with `Cache-Control: no-store`.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCredentialsRequest'
      responses:
        '201':
          description: Account created and session opened.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email is already registered (code `email_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Code `validation_failed`. `details` is `{field, reason}` with field `email` (reason `invalid`)
            or `password` (reasons `too_short`, `too_long`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many sign-ups from this client (code `too_many_attempts`).
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: identityLogin
      summary: Sign in
      description: |
        Exchanges email and password for a session. Failed attempts are rate limited
        (5 attempts per 15 minutes). The response is sent with `Cache-Control: no-store`.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCredentialsRequest'
      responses:
        '200':
          description: Session opened.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password (code `invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Code `validation_failed` with `details` `{field, reason}` for a malformed email or password length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts (code `too_many_attempts`, `details.retry_after_seconds`).
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: too_many_attempts
                  message: too many failed attempts, try again later
                  details:
                    retry_after_seconds: 600
  /auth/refresh:
    post:
      operationId: identityRefresh
      summary: Renew a session
      description: Exchanges a refresh token for a new session. The refresh token is rotated; send the new one next time.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRefreshRequest'
      responses:
        '200':
          description: New session.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The refresh token is unknown, expired or revoked (code `invalid_session`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: identityLogout
      summary: Sign out
      description: Revokes the given refresh token. It needs no access token.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRefreshRequest'
      responses:
        '204':
          description: Session closed. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
  /search:
    get:
      operationId: searchNearby
      summary: Search branches near a point
      description: Public proximity search. Ordered by distance band, featured first, then exact distance. Takes no identity.
      tags: [Search]
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          description: Longitude.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius_m
          in: query
          required: true
          description: Search radius in meters (an omitted or zero value is rejected as out_of_range).
          schema:
            type: integer
            minimum: 1
            maximum: 50000
        - name: limit
          in: query
          required: true
          description: Page size (an omitted or zero value is rejected as out_of_range).
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: category
          in: query
          required: false
          description: Category slug; empty means all.
          schema:
            type: string
        - name: min_rating
          in: query
          required: false
          description: Minimum rating filter, 0 meaning none. It filters only branches with enough reviews to show stars; it never orders.
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 5
            default: 0
      responses:
        '200':
          description: One page of branch cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '422':
          description: |
            Code `validation_failed`. `details` is `{field, reason}`; reason is `required` (lat, lng),
            `invalid` (not a number) or `out_of_range`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /home/featured:
    get:
      operationId: searchFeatured
      summary: Featured branches near a point
      description: Rotating "Destacados cerca tuyo" section (featured businesses). Takes lat, lng, radius_m and limit; category and offset are ignored.
      tags: [Search]
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius_m
          in: query
          required: true
          description: Radius in meters.
          schema:
            type: integer
            minimum: 1
            maximum: 50000
        - name: limit
          in: query
          required: true
          description: Maximum number of cards.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Featured branch cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFeaturedResults'
        '422':
          description: Code `validation_failed` with `details` `{field, reason}` (required, invalid, out_of_range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /businesses/{slug}:
    get:
      operationId: searchBusinessProfile
      summary: Public business page
      description: Data behind the public business page. Only public businesses are served.
      tags: [Search]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Business slug.
          schema:
            type: string
      responses:
        '200':
          description: The business profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchBusinessProfile'
        '404':
          description: The business does not exist or is not public (code `business_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /businesses/{slug}/view:
    post:
      operationId: searchRecordProfileView
      summary: Count a profile view
      description: Beacon the public page sends after it loads. It increments an aggregate counter; no personal data is stored. Always answers 204 whether or not it counted, so it does not reveal which businesses exist.
      tags: [Search]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Business slug.
          schema:
            type: string
      responses:
        '204':
          description: Accepted. No body.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
  /r/wa/{branch_id}:
    get:
      operationId: searchOpenWhatsApp
      summary: Redirect to the branch WhatsApp conversation
      description: Counts the click and answers 302 with the wa.me link in `Location`. The number never appears in a body.
      tags: [Search]
      security: []
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: service
          in: query
          required: false
          description: Service id to mention in the prefilled message.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '302':
          description: Redirect to WhatsApp.
          headers:
            Location:
              description: The wa.me link.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
        '404':
          description: The branch does not exist or is not public, or branch_id is not a positive integer (code `branch_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The service parameter is not a positive integer (code `validation_failed`, field service, reason invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    head:
      operationId: searchPreviewWhatsApp
      summary: Preview the WhatsApp redirect without counting
      description: Same answer as GET but no click is counted; used by link previewers.
      tags: [Search]
      security: []
      parameters:
        - name: branch_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: service
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '302':
          description: Redirect to WhatsApp (not counted).
          headers:
            Location:
              schema:
                type: string
        '404':
          description: Branch not found (code `branch_not_found`).
        '422':
          description: The service parameter is invalid (code `validation_failed`).
  /categories:
    get:
      operationId: businessListCategories
      summary: List business categories
      description: Public catalog offered by the sign-up form. Cached for 5 minutes (Cache-Control public, max-age=300).
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCategoryList'
  /me/business:
    get:
      operationId: businessGetMine
      summary: Get my business
      description: >-
        Returns the business of the caller with its branches (and their hours) and photos. Requires role
        business_admin. Responses are Cache-Control no-store.
      tags: [Business]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The business, branches and images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessMine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has not created a business yet (code business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    post:
      operationId: businessCreate
      summary: Create my business
      description: >-
        Creates the business of the caller as a draft. The slug is derived from the name and made unique
        automatically. Each owner may have only one business. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfileRequest'
      responses:
        '201':
          description: Business created in status draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'The caller already has a business (business_exists) or no free slug could be built from the name (slug_unavailable).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: >-
            Validation failed. details.field is one of name (invalid, no_letters_or_digits), description (too_long),
            whatsapp (invalid), category_id (required, unknown).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    put:
      operationId: businessUpdate
      summary: Update my business profile
      description: >-
        Replaces category, name, description and WhatsApp. The slug never changes. A deleted business cannot be
        edited. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfileRequest'
      responses:
        '200':
          description: The updated business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has no business (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 'The business was deleted (business_deleted).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Validation failed; same fields as business creation.'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/submit:
    post:
      operationId: businessSubmit
      summary: Submit my business for review
      description: >-
        Moves the business from draft to pending_review and records the Mercado Pago payer email and name the
        owner paid with (the super admin crosses them with the payment notice). Nothing is charged or activated
        here. Only a draft can be submitted. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessSubmitRequest'
      responses:
        '200':
          description: The business, now in pending_review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has no business (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 'The business is not a draft (invalid_state).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Validation failed. details.field is mp_payer_email or mp_payer_name (reason invalid).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/geocode:
    post:
      operationId: businessGeocodeAddress
      summary: Find the map position of an address
      description: >-
        Looks up an address (searched as "address, city, Argentina") so the owner can place the branch pin.
        Nothing is stored. Call it once per explicit user action, never as-you-type. Requires role business_admin
        and an existing, non-deleted business.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessGeocodeRequest'
      responses:
        '200':
          description: Position of the best match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessGeocodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'No business (business_not_found) or the address was not found (address_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 'The business was deleted (business_deleted).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Validation failed. details.field is address or city (reason invalid).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: 'The geocoder is busy (geocoder_busy). Retry after the seconds in Retry-After (5).'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502':
          description: 'The geocoder is down (geocoder_unavailable); the owner should place the pin by hand.'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/images/presign:
    post:
      operationId: businessPresignImage
      summary: Get a presigned photo upload URL
      description: >-
        Step 1 of a photo upload. The server builds the object key (businesses/{businessId}/{random}.{ext}) and
        returns a short-lived URL: send the file bytes straight to the object server with the returned method and
        headers (the body must be exactly size bytes), then call POST /me/business/images with the object_key.
        Accepted types are JPEG, PNG and WebP, up to 5 MiB. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPresignRequest'
      responses:
        '200':
          description: Object key and upload instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPresignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has no business (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 'The business was deleted (business_deleted).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Validation failed. details.field is content_type (not_allowed) or size (invalid).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/images:
    post:
      operationId: businessRegisterImage
      summary: Register an uploaded photo
      description: >-
        Step 2 of a photo upload: registers an object already uploaded through the presigned URL. The photo is
        appended at the end (position 0 is the cover). The number of photos is limited (max_images in GET
        /me/business); the error details carry max. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessRegisterImageRequest'
      responses:
        '201':
          description: Photo registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessRegisteredImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has no business (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: >-
            The photo limit is reached (image_limit_reached, details.max), the photo is already registered
            (image_exists) or the business was deleted (business_deleted).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Validation failed. details.field is object_key (invalid: wrong folder or extension; not_uploaded: the object does not exist).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/images/order:
    put:
      operationId: businessReorderImages
      summary: Reorder my photos
      description: >-
        Sets the order of the photos. The list must contain every photo id of the business exactly once; the
        first becomes the cover. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessReorderImagesRequest'
      responses:
        '204':
          description: Order saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'The caller has no business (business_not_found).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 'The business was deleted (business_deleted).'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'details.field is ids (invalid): the list is not the exact set of the business photo ids.'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /me/business/images/{id}:
    delete:
      operationId: businessRemoveImage
      summary: Remove a photo
      description: >-
        Removes a photo of the caller business and schedules its object for deletion. A non-numeric or foreign id
        is answered as not found. Requires role business_admin.
      tags: [Business]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Photo id.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Photo removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
