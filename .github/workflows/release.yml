name: Release

# Al empujar un tag vX.Y.Z se construyen las cuatro imágenes de producción y se suben a
# ghcr.io (SDD 8.4). El VPS no compila nada: solo hace `docker compose pull`.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Las NEXT_PUBLIC_* del frontend se incrustan en el build: se definen como variables del
# repositorio (Settings > Secrets and variables > Actions > Variables), no como secretos,
# porque terminan en el JavaScript público.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: image ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
            target: api
          - name: worker
            context: backend
            file: backend/Dockerfile
            target: worker
          - name: migrate
            context: backend
            file: backend/Dockerfile
            target: migrate
          - name: web
            context: frontend
            file: frontend/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7.0.1

      # ghcr.io exige el nombre en minúsculas.
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/movo-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
            NEXT_PUBLIC_MAP_PMTILES_URL=${{ vars.NEXT_PUBLIC_MAP_PMTILES_URL }}
            NEXT_PUBLIC_MAP_ASSETS_URL=${{ vars.NEXT_PUBLIC_MAP_ASSETS_URL }}
            NEXT_PUBLIC_MAP_STYLE_URL=${{ vars.NEXT_PUBLIC_MAP_STYLE_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
