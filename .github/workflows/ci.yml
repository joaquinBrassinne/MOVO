name: CI

# Cada push a una rama de trabajo y cada PR contra develop/main pasan por
# lint, tests, build y migraciones (SDD §2 y tarea 0.6).
on:
  push:
    branches:
      - develop
      - main
      # `**` cruza la barra: `phase-*` no matchea `phase-0/foundations`.
      - "phase-**"
  pull_request:
    branches:
      - develop
      - main

# Un push nuevo sobre la misma rama cancela el run anterior: no tiene sentido
# esperar el resultado de un commit que ya quedó viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El pipeline sólo lee el repositorio (SDD §7.1: permisos mínimos).
permissions:
  contents: read

# Los pasos invocan los targets del Makefile de la raíz, que ya entran solos a
# backend/: un `working-directory: backend` acá dejaría a make sin Makefile.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Misma versión que `make lint` y que backend/.golangci.yml.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # -race necesita cgo: en Linux está disponible, en el Windows de desarrollo no.
      - run: make test TESTFLAGS="-race -count=1"

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make build

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    # Misma imagen que deploy/docker-compose.yml: la migración se valida contra
    # la versión de PostgreSQL+PostGIS que corre en desarrollo.
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movo -d movo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://movo:movo@localhost:5432/movo?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Ida y vuelta: subir, revertir y volver a subir prueba que el `down` de
      # cada migración existe y funciona, no sólo el `up`.
      - name: apply migrations
        run: make migrate-up
      - name: show status
        run: make migrate-status
      - name: revert the last migration
        run: make migrate-down
      - name: re-apply migrations
        run: make migrate-up
